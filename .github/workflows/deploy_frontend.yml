name: Deploy Frontend

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy_frontend.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.map.outputs.env_name }}
      backend_url: ${{ steps.map.outputs.backend_url }}
      s3_bucket: ${{ steps.map.outputs.s3_bucket }}
      s3_origin: ${{ steps.map.outputs.s3_origin }}
    steps:
      - name: Map branch to environment config
        id: map
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "env_name=prod" >> $GITHUB_OUTPUT
            echo "backend_url=https://PROD_API_PLACEHOLDER" >> $GITHUB_OUTPUT
            echo "s3_bucket=kpz-frontend-prod" >> $GITHUB_OUTPUT
            echo "s3_origin=kpz-frontend-prod.s3-website.eu-central-1.amazonaws.com" >> $GITHUB_OUTPUT
          else
            echo "env_name=dev" >> $GITHUB_OUTPUT
            echo "backend_url=https://q53a8x2xfl.execute-api.eu-central-1.amazonaws.com" >> $GITHUB_OUTPUT
            echo "s3_bucket=kpz-frontend-dev" >> $GITHUB_OUTPUT
            echo "s3_origin=kpz-frontend-dev.s3-website.eu-central-1.amazonaws.com" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    # Remove when prod infra is provisioned (terraform-prod.yml enabled and applied)
    if: needs.prepare.outputs.env_name == 'dev'
    environment: ${{ needs.prepare.outputs.env_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        env:
          VITE_BACKEND_URL: ${{ needs.prepare.outputs.backend_url }}
          VITE_PUBLIC_HERE_API_KEY: ${{ secrets.VITE_PUBLIC_HERE_API_KEY }}
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
        run: |
          cd frontend
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Sync to S3 bucket
        run: |
          aws s3 sync frontend/dist/ s3://${{ needs.prepare.outputs.s3_bucket }}/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html" \
            --region eu-central-1

          # HTML files with short cache (for SPA routing)
          aws s3 sync frontend/dist/ s3://${{ needs.prepare.outputs.s3_bucket }}/ \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public,max-age=0,must-revalidate" \
            --region eu-central-1

      - name: Get CloudFront distribution ID and URL
        id: cloudfront
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Origins.Items[?DomainName=='${{ needs.prepare.outputs.s3_origin }}']].Id | [0]" \
            --output text \
            --region eu-central-1)

          DISTRIBUTION_URL=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Origins.Items[?DomainName=='${{ needs.prepare.outputs.s3_origin }}']].DomainName | [0]" \
            --output text \
            --region eu-central-1)

          echo "distribution_id=$DISTRIBUTION_ID" >> $GITHUB_OUTPUT
          echo "distribution_url=https://$DISTRIBUTION_URL" >> $GITHUB_OUTPUT
          echo "CloudFront Distribution ID: $DISTRIBUTION_ID"
          echo "CloudFront URL: https://$DISTRIBUTION_URL"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.cloudfront.outputs.distribution_id }} \
            --paths "/*" \
            --region eu-central-1

      - name: Deployment summary
        run: |
          echo "✅ Frontend deployed to S3/CloudFront (${{ needs.prepare.outputs.env_name }})"
          echo "S3 Bucket: ${{ needs.prepare.outputs.s3_bucket }}"
          echo "CloudFront Distribution: ${{ steps.cloudfront.outputs.distribution_id }}"
          echo "CloudFront URL: ${{ steps.cloudfront.outputs.distribution_url }}"
          echo "Region: eu-central-1"
          echo ""
          echo "Note: CloudFront cache invalidation may take a few minutes to propagate globally."
